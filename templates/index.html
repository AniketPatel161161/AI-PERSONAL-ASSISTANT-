<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Personal Assistant</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Decorative background shapes (styled in style.css) -->
    <div class="bg-shapes" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
    </div>

    <h1 class="main-heading">AI Personal Assistant</h1>

    <div class="container">

        <h2>Ask Anything</h2>
        <form id="askForm">
            <input type="text" name="question" placeholder="Ask anything..." required>
            <button type="submit">Ask</button>
        </form>
        <p id="ans-loading" style="display: none;">Processing...</p>
        <p id="answer"></p>

        <hr>

        <h2>Summarize Email</h2>
        <form id="emailForm">
            <textarea name="email" placeholder="Paste your email here.." required></textarea>
            <button type="submit">Summarize</button>
        </form>
        <p id="summary-loading" style="display: none;">Processing...</p>
        <p id="summary"></p>

    </div>

<script>
async function submitForm(e, url, loadingId, outputId) {
    e.preventDefault();
    const loading = document.getElementById(loadingId);
    const output = document.getElementById(outputId);

    loading.style.display = "flex";
    output.classList.remove("error");
    output.innerText = "";

    try {
        const res = await fetch(url, {
            method: "POST",
            body: new FormData(e.target)
        });

        const data = await res.json();

        if (!res.ok || data.error) {
            output.classList.add("error");
            output.innerText = "Error: " + (data.error || res.statusText);
        } else {
            output.innerText = data.response;
        }
    } catch (err) {
        output.classList.add("error");
        output.innerText = "Something went wrong: " + err.message;
        console.error(err);
    } finally {
        loading.style.display = "none";   // always runs, so no stuck loader
    }
}

document.getElementById("askForm").onsubmit = (e) =>
    submitForm(e, "/ask", "ans-loading", "answer");

document.getElementById("emailForm").onsubmit = (e) =>
    submitForm(e, "/summarize", "summary-loading", "summary");
</script>

</body>
</html>
